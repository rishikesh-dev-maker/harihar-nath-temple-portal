# ==============================================================================
# BABA HARIHARNATH TEMPLE - SPRING BOOT CONFIGURATION
# ==============================================================================
spring.application.name=temple-backend

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hariharnath_temple?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rishi@#$143}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security
# 64-byte Base64-encoded secret key
jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnlzZWN1cmVhbmRzdHJvbmdzZWNyZXRrZXlmb3JoYXJpaGFybmF0aHRlbXBsZXByb2plY3QyMDI2c2VjdXJl}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration (Comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080}

# Initial Admin Seeding (Used by DataInitializer)
admin.name=${ADMIN_NAME:Temple Administrator}
admin.email=${ADMIN_EMAIL:admin@hariharnath.in}
admin.password=${ADMIN_PASSWORD:Admin@123}

# Temple Administration Contact
temple.admin.email=${TEMPLE_ADMIN_EMAIL:booking@hariharnath.in}

# SMTP Email Configuration (Graceful fallback if not configured)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
